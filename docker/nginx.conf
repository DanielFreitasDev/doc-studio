# Servidor do Estúdio de Documentos no contêiner (instalado como
# /etc/nginx/conf.d/default.conf; o nginx.conf principal da imagem
# nginx-unprivileged já põe PID e arquivos temporários em /tmp).
# Este arquivo entra no bloco `http` do nginx.

# O app não tem etapa de build nem nomes de arquivo com hash: HTML, CSS, JS e
# JSON são revalidados a cada carga (ETag → 304), para que uma imagem nova
# chegue ao navegador sem "recarregar sem cache". Fontes e logos mudam pouco.
map $uri $docstudio_cache_control {
    ~^/assets/  "public, max-age=86400";
    default     "no-cache";
}

server {
    # Só IPv4: `[::]` derruba o nginx em hosts com IPv6 desligado no kernel.
    listen 8080;
    server_name _;

    root /srv/doc-studio;
    index index.html;

    server_tokens off;
    # Redirecionamentos relativos: atrás do mapeamento de portas do Docker ou
    # de um proxy, o nginx não conhece a porta nem o endereço públicos.
    absolute_redirect off;

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript text/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript text/javascript application/json image/svg+xml;

    add_header Cache-Control $docstudio_cache_control;

    # A política completa fica no <meta> do index.html (fonte única). O
    # cabeçalho só acrescenta o que o <meta> não consegue expressar
    # (frame-ancestors) e o que vale também fora do HTML (SVG aberto direto).
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Arquivos ocultos nunca são servidos (defesa extra: a imagem não os copia).
    location ~ /\. {
        return 404;
    }

    # Verificação de saúde do contêiner (HEALTHCHECK do Dockerfile), fora do log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
