server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem hashing de nome de arquivo neste projeto: evita servir JS/CSS velho após um deploy
    # (mesmo motivo do "no-store" em tools/docstudio.mjs serve).
    add_header Cache-Control "no-cache, must-revalidate" always;

    # ES modules precisam do MIME certo; o mime.types padrão do nginx não inclui .mjs.
    location ~ \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
